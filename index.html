<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Block Bros - 8-Bit Multiplayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;700&display=swap');
        
        body { margin: 0; overflow: hidden; background-color: #0f0c1b; font-family: 'Inter', sans-serif; user-select: none; color: white; }
        #game-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; image-rendering: pixelated; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
        
        /* Glassmorphism Dark/Wine Theme */
        .glass-panel {
            background: rgba(20, 15, 30, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border-radius: 16px;
        }

        .btn-retro {
            background: linear-gradient(135deg, #7c224e, #4a1532);
            color: white;
            border: 1px solid #a8326a;
            border-radius: 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #310c20, 0 5px 15px rgba(124, 34, 78, 0.4);
            text-shadow: 1px 1px 0px #000;
        }
        .btn-retro:hover { background: linear-gradient(135deg, #962c60, #5c1c3f); transform: translateY(-2px); }
        .btn-retro:active { transform: translateY(4px); box-shadow: 0 0 0 #310c20; }
        
        .btn-retro-blue { background: linear-gradient(135deg, #2d3748, #1a202c); border-color: #4a5568; box-shadow: 0 4px 0 #000; }
        .btn-retro-blue:hover { background: linear-gradient(135deg, #4a5568, #2d3748); }

        .pixel-text { font-family: 'Press Start 2P', cursive; }
        .hud-text { font-family: 'Press Start 2P', cursive; font-size: 0.7rem; text-shadow: 2px 2px 0px #000; }

        input { background: rgba(0,0,0,0.5); color: #e2e8f0; border: 2px solid rgba(124, 34, 78, 0.5); }
        input:focus { border-color: #a8326a; outline: none; box-shadow: 0 0 10px rgba(124, 34, 78, 0.5); }

        #countdown-display { font-size: 6rem; text-shadow: 4px 4px 0 #7c224e, 8px 8px 0 #000; display: none; }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <div id="ui-layer" class="flex items-center justify-center">
        
        <!-- Menú Principal -->
        <div id="main-menu" class="glass-panel p-8 w-11/12 max-w-md text-center interactive flex flex-col items-center">
            <h1 class="text-2xl pixel-text mb-4 text-pink-400">BLOCK BROS</h1>
            <p class="text-sm text-gray-300 mb-6 font-medium">Multijugador 8-Bits</p>
            
            <div id="loading-auth" class="text-pink-300 animate-pulse font-mono text-sm hidden mb-4">Conectando al servidor...</div>

            <div id="menu-actions" class="w-full space-y-4">
                <button id="btn-create-room" class="btn-retro w-full py-4">Crear Sala</button>
                <div class="flex py-2 items-center"><div class="flex-grow border-t border-gray-700"></div><span class="mx-4 text-gray-500 font-bold text-sm">O</span><div class="flex-grow border-t border-gray-700"></div></div>
                <input type="text" id="input-room-code" placeholder="CÓDIGO" class="w-full p-3 rounded text-center text-xl font-mono uppercase">
                <button id="btn-join-room" class="btn-retro btn-retro-blue w-full py-4">Unirse</button>
            </div>
        </div>

        <!-- Panel de Lobby (Sala de espera) -->
        <div id="lobby-panel" class="absolute top-6 glass-panel p-4 interactive hidden flex-col items-center min-w-[300px]">
            <h2 class="pixel-text text-pink-400 text-sm mb-2">SALA: <span id="lobby-room-code" class="text-white">---</span></h2>
            <p id="lobby-status" class="text-xs text-gray-300 mb-4">Esperando jugadores...</p>
            <div id="players-list" class="w-full flex gap-2 justify-center mb-4 flex-wrap"></div>
            <button id="btn-start-game" class="btn-retro w-full py-3 hidden">Iniciar Partida</button>
            <p id="wait-host-msg" class="text-xs text-gray-400 hidden">El anfitrión iniciará pronto...</p>
        </div>

        <!-- HUD del Juego -->
        <div id="game-hud" class="absolute top-4 left-4 interactive hidden flex-col">
            <div class="hud-text text-pink-400">SALA: <span id="hud-room-code" class="text-white">---</span></div>
        </div>

        <!-- Cuenta Regresiva Gigante -->
        <div id="countdown-display" class="pixel-text text-white font-black animate-bounce absolute">3</div>

        <!-- Fin de Juego -->
        <div id="game-over-screen" class="glass-panel p-8 w-11/12 max-w-sm text-center interactive hidden flex-col items-center">
            <h2 id="end-title" class="text-2xl pixel-text mb-4 text-yellow-400">¡FIN!</h2>
            <p id="end-subtitle" class="text-gray-300 mb-6">Alguien ganó.</p>
            <button id="btn-leave-room" class="btn-retro w-full py-4">Salir</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // 1. CONFIGURACIÓN FIREBASE (La tuya)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCCG2VPH4-SHRwTOx2FzfNBpLojJl_V5k4",
            authDomain: "multiplayerserverma.firebaseapp.com",
            projectId: "multiplayerserverma",
            storageBucket: "multiplayerserverma.firebasestorage.app",
            messagingSenderId: "704001583862",
            appId: "1:704001583862:web:0c78bb0e1129d2e9b4dad7",
            measurementId: "G-W2HDCMW0BQ"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        let currentUserId = null;
        let currentRoomId = null;
        let unsubscribeRoom = null;
        let isHost = false;
        
        // Paleta de colores para jugadores
        const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#06b6d4'];
        let myColor = colors[Math.floor(Math.random() * colors.length)];

        // ==========================================
        // 2. MOTOR DE JUEGO (CANVAS 2D)
        // ==========================================
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Variables de Estado
        let gameState = 'MENU'; // MENU, LOBBY, COUNTDOWN, PLAYING, ENDED
        let remotePlayers = {}; 
        let mapBlocks = [];
        let enemies = [];
        let particles = [];
        let goalBox = null;
        let camera = { x: 0, y: 0, zoom: 1 };
        
        const keys = { left: false, right: false, up: false };
        let sendTimer = 0;

        // Físicas Mejoradas
        const GRAVITY = 0.6;
        const FRICTION = 0.8;
        const MOVE_SPEED = 1.2;
        const MAX_SPEED_X = 6;
        const JUMP_FORCE = -10;
        const JUMP_HOLD = -0.6;
        
        let player = {
            x: 50, y: 0, vx: 0, vy: 0, w: 24, h: 24,
            onGround: false, isJumping: false, jumpFrames: 0,
            color: myColor, faceRight: true, walkTimer: 0,
            squash: 1, stretch: 1 // Para animaciones de salto
        };

        // Sistema de Audio 8-bit
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            if (type === 'jump') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'blip') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'go') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            }
        }

        function createParticles(x, y, color, amount = 8) {
            for(let i=0; i<amount; i++) {
                particles.push({
                    x: x + 12, y: y + 24,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 1) * 6,
                    life: 1.0, color: color
                });
            }
        }

        // Diseño Nivel (Lobby)
        function buildLobby() {
            mapBlocks = [
                { x: 0, y: 150, w: 400, h: 50, type: 'floor' },
                { x: -50, y: -200, w: 50, h: 400, type: 'wall' },
                { x: 400, y: -200, w: 50, h: 400, type: 'wall' }
            ];
            enemies = [];
            goalBox = null;
            player.x = 180; player.y = 50; player.vx = 0; player.vy = 0;
        }

        // Diseño Nivel (Aleatorio / Procedural)
        function generateRandomMap() {
            let layout = [];
            let enems = [];
            
            // Inicio
            layout.push({ x: 0, y: 200, w: 300, h: 200, type: 'floor' });
            
            let curX = 300;
            let curY = 200;
            
            for(let i=0; i<15; i++) {
                // Hueco aleatorio
                curX += 60 + Math.random() * 80; 
                // Altura aleatoria
                curY += (Math.random() - 0.5) * 120;
                let w = 100 + Math.random() * 200;
                
                layout.push({ x: curX, y: curY, w: w, h: 300, type: 'floor' });
                
                // Agregar Enemigo a veces
                if (Math.random() > 0.4) {
                    enems.push({ x: curX + 20, y: curY - 24, w: 24, h: 24, minX: curX, maxX: curX + w - 24, dir: 1 });
                }
                
                // Bloque de salto difícil (1 bloque)
                if (Math.random() > 0.7) {
                    layout.push({ x: curX + w + 40, y: curY - 40, w: 30, h: 30, type: 'floor' });
                    curX += 70;
                }
                
                curX += w;
            }
            
            // Meta
            curX += 100;
            layout.push({ x: curX, y: curY, w: 300, h: 200, type: 'floor' });
            let goal = { x: curX + 100, y: curY - 60, w: 40, h: 40, type: 'goal' };
            
            return { layout, enems, goal };
        }

        function respawn() {
            playSound('hit');
            createParticles(player.x, player.y, player.color, 15);
            player.x = 50; player.y = 0; 
            player.vx = 0; player.vy = 0;
            camera.x = 0; camera.y = 0;
        }

        // Lógica de Físicas y Colisiones Exactas (AABB Antibugs)
        function checkCol(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function updatePhysics() {
            if (gameState === 'MENU' || gameState === 'ENDED') return;

            // Controles
            if (keys.left) { player.vx -= MOVE_SPEED; player.faceRight = false; }
            if (keys.right) { player.vx += MOVE_SPEED; player.faceRight = true; }
            
            // Fricción y límite X
            player.vx *= FRICTION;
            if (player.vx > MAX_SPEED_X) player.vx = MAX_SPEED_X;
            if (player.vx < -MAX_SPEED_X) player.vx = -MAX_SPEED_X;
            
            if (Math.abs(player.vx) > 0.5) player.walkTimer += 0.2;
            else player.walkTimer = 0;

            // Salto prolongado (Mecánica)
            if (keys.up) {
                if (player.onGround) {
                    player.vy = JUMP_FORCE;
                    player.onGround = false;
                    player.isJumping = true;
                    player.jumpFrames = 0;
                    player.squash = 0.5; player.stretch = 1.5; // Animación estirar
                    playSound('jump');
                    createParticles(player.x, player.y + 10, '#ffffff');
                } else if (player.isJumping && player.jumpFrames < 15) {
                    player.vy += JUMP_HOLD; // Salto más alto si mantienes presionado
                    player.jumpFrames++;
                }
            } else {
                player.isJumping = false;
            }

            player.vy += GRAVITY;
            if (player.vy > 12) player.vy = 12; // Terminal velocity

            // Restaurar squash/stretch poco a poco
            player.squash += (1 - player.squash) * 0.2;
            player.stretch += (1 - player.stretch) * 0.2;

            // --- RESOLUCIÓN COLISIONES (Eje Y) ---
            player.y += player.vy;
            player.onGround = false;
            for (let b of mapBlocks) {
                if (checkCol(player, b)) {
                    if (player.vy > 0) { 
                        player.y = b.y - player.h; 
                        player.vy = 0; 
                        if (!player.onGround) { player.squash = 1.4; player.stretch = 0.7; } // Aplastar al caer
                        player.onGround = true; 
                    }
                    else if (player.vy < 0) { player.y = b.y + b.h; player.vy = 0; }
                }
            }

            // --- RESOLUCIÓN COLISIONES (Eje X) ---
            player.x += player.vx;
            for (let b of mapBlocks) {
                if (checkCol(player, b)) {
                    if (player.vx > 0) { player.x = b.x - player.w; player.vx = 0; }
                    else if (player.vx < 0) { player.x = b.x + b.w; player.vx = 0; }
                }
            }

            // Enemigos
            for (let e of enemies) {
                e.x += 2 * e.dir;
                if (e.x > e.maxX) { e.x = e.maxX; e.dir = -1; }
                if (e.x < e.minX) { e.x = e.minX; e.dir = 1; }
                
                // Si tocamos enemigo -> Morir
                if (checkCol(player, e) && gameState === 'PLAYING') respawn();
            }

            // Caer al vacío
            if (player.y > 1000 && gameState === 'PLAYING') respawn();

            // Meta
            if (gameState === 'PLAYING' && goalBox && checkCol(player, goalBox)) {
                triggerWin(currentUserId);
            }
        }

        // Renderizado 8-bits
        function drawSprite(ctx, x, y, w, h, color, faceRight, walkTimer, squash, stretch) {
            ctx.save();
            // Aplicar Transformaciones (Squash & Stretch)
            ctx.translate(x + w/2, y + h);
            ctx.scale(squash, stretch);
            ctx.translate(-w/2, -h);

            // Cuerpo principal pixelado
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, w, h);
            
            // Ojos
            ctx.fillStyle = 'white';
            let eyeOffsetX = faceRight ? 12 : 4;
            ctx.fillRect(eyeOffsetX, 4, 6, 6);
            ctx.fillStyle = 'black';
            ctx.fillRect(eyeOffsetX + (faceRight?2:0), 6, 4, 4);

            // Piernas (Animación de caminar)
            ctx.fillStyle = '#222';
            let legOffset = Math.sin(walkTimer) * 4;
            ctx.fillRect(4, h, 6, 4 + legOffset);
            ctx.fillRect(w - 10, h, 6, 4 - legOffset);
            
            ctx.restore();
        }

        function render() {
            // Fondo oscuro puro 8-bit
            ctx.fillStyle = '#0f0c1b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'MENU') return;

            // Cámara Suave
            let targetZoom = gameState === 'LOBBY' ? 0.6 : 1.2; // Alejar cámara en lobby
            camera.zoom += (targetZoom - camera.zoom) * 0.05;
            
            let targetCamX = player.x - (canvas.width/2)/camera.zoom;
            let targetCamY = player.y - (canvas.height/1.5)/camera.zoom;
            camera.x += (targetCamX - camera.x) * 0.1;
            camera.y += (targetCamY - camera.y) * 0.1;

            ctx.save();
            ctx.scale(camera.zoom, camera.zoom);
            ctx.translate(-camera.x, -camera.y);

            // Dibujar Mapa
            for (let b of mapBlocks) {
                if (b.x + b.w < camera.x || b.x > camera.x + canvas.width/camera.zoom) continue; // Culling
                
                ctx.fillStyle = '#1e1a33'; // Borde oscuro
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.fillStyle = '#2a224a'; // Centro vino/púrpura
                ctx.fillRect(b.x+2, b.y+2, b.w-4, b.h-4);
                // Patrón pixelado arriba
                ctx.fillStyle = '#7c224e';
                ctx.fillRect(b.x, b.y, b.w, 8);
            }

            // Meta
            if (goalBox) {
                ctx.fillStyle = '#eab308'; // Dorado
                ctx.fillRect(goalBox.x, goalBox.y, goalBox.w, goalBox.h);
                ctx.fillStyle = 'white';
                ctx.fillText("META", goalBox.x, goalBox.y - 10);
            }

            // Enemigos (Rojos con dientes)
            for (let e of enemies) {
                ctx.fillStyle = '#e11d48';
                ctx.fillRect(e.x, e.y, e.w, e.h);
                ctx.fillStyle = 'black';
                ctx.fillRect(e.x + 4, e.y + 4, 16, 4); // Visor enojado
            }

            // Jugadores Remotos
            for (let uid in remotePlayers) {
                let p = remotePlayers[uid];
                // Interpolar suave
                p.renderX += (p.x - p.renderX) * 0.3;
                p.renderY += (p.y - p.renderY) * 0.3;
                drawSprite(ctx, p.renderX, p.renderY, 24, 24, p.color, p.x > p.renderX, p.x !== p.renderX ? performance.now()/100 : 0, 1, 1);
                
                // Nombre
                ctx.fillStyle = 'white';
                ctx.font = '8px "Press Start 2P"';
                ctx.fillText(uid.substring(0,4), p.renderX - 4, p.renderY - 10);
            }

            // Jugador Local
            drawSprite(ctx, player.x, player.y, player.w, player.h, player.color, player.faceRight, player.walkTimer, player.squash, player.stretch);

            // Partículas
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.05;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, 4, 4);
                ctx.globalAlpha = 1.0;
                if (p.life <= 0) particles.splice(i, 1);
            }

            ctx.restore();
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            updatePhysics();
            render();

            // Enviar datos red (15 veces por segundo, sin saturar)
            if ((gameState === 'PLAYING' || gameState === 'LOBBY') && currentRoomId) {
                if (performance.now() - sendTimer > 66) {
                    syncPosition();
                    sendTimer = performance.now();
                }
            }
        }

        // ==========================================
        // 3. EVENTOS Y CONTROLES
        // ==========================================
        window.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if(e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if(e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = true;
        });
        window.addEventListener('keyup', (e) => {
            if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if(e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if(e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = false;
        });
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // ==========================================
        // 4. FIREBASE RED Y LÓGICA DE SALA
        // ==========================================
        async function initAuth() {
            document.getElementById('menu-actions').classList.add('hidden');
            document.getElementById('loading-auth').classList.remove('hidden');
            try { await signInAnonymously(auth); } 
            catch (error) { console.error(error); alert("Error de red."); }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserId = user.uid;
                document.getElementById('loading-auth').classList.add('hidden');
                document.getElementById('menu-actions').classList.remove('hidden');
            }
        });

        function getRoomRef(roomId) { return doc(db, 'rooms', roomId); }

        async function createRoom() {
            if (!currentUserId) return;
            const newRoomId = Math.random().toString(36).substring(2, 6).toUpperCase();
            isHost = true;
            
            await setDoc(getRoomRef(newRoomId), {
                status: 'lobby', winner: null, mapData: null,
                players: { [currentUserId]: { x: 0, y: 0, c: myColor } }
            });
            joinRoomProcess(newRoomId);
        }

        async function joinRoom() {
            const code = document.getElementById('input-room-code').value.trim().toUpperCase();
            if (!code) return;
            isHost = false;
            joinRoomProcess(code);
        }

        function joinRoomProcess(roomId) {
            currentRoomId = roomId;
            gameState = 'LOBBY';
            buildLobby();
            
            // Ocultar Main, Mostrar Lobby
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('lobby-panel').classList.remove('hidden');
            document.getElementById('lobby-panel').classList.add('flex');
            document.getElementById('lobby-room-code').textContent = roomId;
            
            if(isHost) {
                document.getElementById('btn-start-game').classList.remove('hidden');
            } else {
                document.getElementById('wait-host-msg').classList.remove('hidden');
            }

            // Escuchar Firestore
            unsubscribeRoom = onSnapshot(getRoomRef(roomId), (docSnap) => {
                if (!docSnap.exists()) return;
                const data = docSnap.data();
                
                // Actualizar jugadores UI
                const listUI = document.getElementById('players-list');
                listUI.innerHTML = '';
                let playerCount = 0;

                for (let uid in data.players) {
                    playerCount++;
                    const pData = data.players[uid];
                    
                    // UI Círculo de color
                    const pDot = document.createElement('div');
                    pDot.className = "w-6 h-6 rounded-full border-2 border-white shadow-lg";
                    pDot.style.backgroundColor = pData.c;
                    listUI.appendChild(pDot);

                    // Motor Remoto
                    if (uid !== currentUserId) {
                        if (!remotePlayers[uid]) remotePlayers[uid] = { renderX: pData.x, renderY: pData.y, x: pData.x, y: pData.y, color: pData.c };
                        else {
                            remotePlayers[uid].x = pData.x;
                            remotePlayers[uid].y = pData.y;
                        }
                    }
                }
                
                document.getElementById('lobby-status').textContent = `${playerCount} Jugador(es) en sala`;

                // Eliminar desconectados
                for (let uid in remotePlayers) { if(!data.players[uid]) delete remotePlayers[uid]; }

                // Cambios de Estado
                if (data.status === 'countdown' && gameState === 'LOBBY') {
                    startCountdownMode(data.mapData);
                }
                if (data.status === 'ended' && gameState === 'PLAYING') {
                    showWinScreen(data.winner);
                }
            });
        }

        async function syncPosition() {
            try {
                await updateDoc(getRoomRef(currentRoomId), {
                    [`players.${currentUserId}`]: { x: Math.round(player.x), y: Math.round(player.y), c: myColor }
                });
            } catch(e){}
        }

        // --- SISTEMA DE INICIO (Host) ---
        document.getElementById('btn-start-game').addEventListener('click', async () => {
            const mapData = generateRandomMap();
            await updateDoc(getRoomRef(currentRoomId), { status: 'countdown', mapData: JSON.stringify(mapData) });
        });
